name: IISM seat check
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # "Run workflow" button for a manual check
concurrency:
  group: seat-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check seats (fails on purpose when seats are open, so GitHub emails you)
        env:
          IISM_COURSE: Snow Skiing Courses at Gulmarg
          IISM_LEVEL: Basic SSC
          IISM_STATE: RAJASTHAN
          IISM_MOBILE: ${{ secrets.IISM_MOBILE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python3 check_seats.py
